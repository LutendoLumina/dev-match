# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service: NestJS serves the API under /api and the built React app everywhere else.
services:
  - type: web
    name: dev-match
    runtime: node
    plan: free
    buildCommand: npm run build
    # Applies any pending database migrations, then starts the server.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploy on every push to the default branch
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: DATABASE_URL
        sync: false # you paste the Neon production connection string when creating the service
